name: Performance Tests

on:
  workflow_dispatch:
    inputs:
      SCENARIO:
        type: 'choice'
        default: './performance_tests/scenarios/grpc/gateway/new_user_get_accounts/v1.0.conf'
        options:
          - ./performance_tests/scenarios/grpc/gateway/existing_user_get_documents/v1.0.conf
          - ./performance_tests/scenarios/grpc/gateway/existing_user_get_operations/v1.0.conf
          - ./performance_tests/scenarios/grpc/gateway/existing_user_issue_virtual_card/v1.0.conf
          - ./performance_tests/scenarios/grpc/gateway/existing_user_make_purchase_operation/v1.0.conf
          - ./performance_tests/scenarios/grpc/gateway/new_user_get_accounts/v1.0.conf
          - ./performance_tests/scenarios/grpc/gateway/new_user_get_documents/v1.0.conf
          - ./performance_tests/scenarios/grpc/gateway/new_user_issue_physical_card/v1.0.conf
          - ./performance_tests/scenarios/grpc/gateway/new_user_make_top_up_operation/v1.0.conf
          - ./performance_tests/scenarios/http/gateway/existing_user_get_documents/v1.0.conf
          - ./performance_tests/scenarios/http/gateway/existing_user_get_operations/v1.0.conf
          - ./performance_tests/scenarios/http/gateway/existing_user_issue_virtual_card/v1.0.conf
          - ./performance_tests/scenarios/http/gateway/existing_user_make_purchase_operation/v1.0.conf
          - ./performance_tests/scenarios/http/gateway/new_user_get_accounts/v1.0.conf
          - ./performance_tests/scenarios/http/gateway/new_user_get_documents/v1.0.conf
          - ./performance_tests/scenarios/http/gateway/new_user_issue_physical_card/v1.0.conf
          - ./performance_tests/scenarios/http/gateway/new_user_make_top_up_operation/v1.0.conf
        required: true
        description: 'Locust config file'

jobs:
  run-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build base Docker image
        run: docker build -f Dockerfile.base -t base-service .

      - name: Start test services
        run: docker compose -f docker-compose.ci.yaml up -d --build

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e ./protos/gen

      - name: Create report directory
        run: mkdir -p ./reports/${{ github.run_id }}

      - name: Run load tests and generate HTML report
        run: locust --config=${{ github.event.inputs.SCENARIO }} --html=./reports/${{ github.run_id }}/index.html

      - name: Stop test services
        if: always()
        run: docker compose -f docker-compose.ci.yaml down -v

      # Сохраняем папку reports как артефакт, чтобы передать её в следующий Job
      - name: Upload reports artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-reports
          path: ./reports/

  publish-report:
    if: always()
    needs: [ run-tests ]
    runs-on: ubuntu-latest
    permissions:
      contents: write # Нужно для пуша в gh-pages
    steps:
      # Скачиваем артефакт с отчетами из предыдущего Job
      - name: Download reports artifact
        uses: actions/download-artifact@v4
        with:
          name: performance-reports
          path: ./reports

      - name: Deploy HTML report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.CI_TOKEN }} # Используем встроенный токен
          keep_files: true
          publish_dir: reports
          publish_branch: gh-pages

      # Добавляем красивую ссылку в Summary запуска
      - name: Add link to report in Summary
        run: |
          REPORT_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/${{ github.run_id }}/index.html"
          echo "### 📊 Результаты нагрузочного тестирования" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Отчет для запуска \`${{ github.run_id }}\` успешно сгенерирован." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "👉 [Открыть HTML-отчет]($REPORT_URL)" >> $GITHUB_STEP_SUMMARY