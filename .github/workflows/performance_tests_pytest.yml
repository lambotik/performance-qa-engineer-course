name: Performance Tests (Pytest + Allure)

on:
  workflow_dispatch:
    inputs:
      TEST:
        type: choice
        required: true
        description: 'Pytest test (single load scenario)'
        default: 'performance_tests/tests/test_load_scenarios.py::test_grpc_gateway_existing_user_get_documents'
        options:
          - performance_tests/tests/test_load_scenarios.py::test_grpc_gateway_existing_user_get_documents
          - performance_tests/tests/test_load_scenarios.py::test_grpc_gateway_existing_user_get_operations
          - performance_tests/tests/test_load_scenarios.py::test_grpc_gateway_existing_user_make_purchase_operation
          - performance_tests/tests/test_load_scenarios.py::test_grpc_gateway_new_user_get_accounts
          - performance_tests/tests/test_load_scenarios.py::test_grpc_gateway_new_user_get_documents
          - performance_tests/tests/test_load_scenarios.py::test_grpc_gateway_new_user_issue_physical_card
          - performance_tests/tests/test_load_scenarios.py::test_grpc_gateway_new_user_make_top_up_operation
          - performance_tests/tests/test_load_scenarios.py::test_http_gateway_existing_user_get_documents
          - performance_tests/tests/test_load_scenarios.py::test_http_gateway_existing_user_get_operations
          - performance_tests/tests/test_load_scenarios.py::test_http_gateway_existing_user_issue_virtual_card
          - performance_tests/tests/test_load_scenarios.py::test_http_gateway_existing_user_make_purchase_operation
          - performance_tests/tests/test_load_scenarios.py::test_http_gateway_new_user_get_accounts
          - performance_tests/tests/test_load_scenarios.py::test_http_gateway_new_user_get_documents
          - performance_tests/tests/test_load_scenarios.py::test_http_gateway_new_user_issue_physical_card
          - performance_tests/tests/test_load_scenarios.py::test_http_gateway_new_user_make_top_up_operation

jobs:
  run-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build base Docker image
        run: docker build -f Dockerfile.base -t base-service .

      - name: Start test services
        run: docker compose -f docker-compose.ci.yaml up -d --build

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e ./protos/gen
          pip install allure-pytest

      - name: Run selected load scenario test
        run: pytest "${{ github.event.inputs.TEST }}" --alluredir=./allure-results

      - name: Stop test services
        if: always()
        run: docker compose -f docker-compose.ci.yaml down -v

      - name: Upload allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: ./allure-results

      - name: Upload locust reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: locust-reports
          path: performance_tests/scenarios/**/report.html

  publish-allure-report:
    if: always()
    needs: [run-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TEST_NODEID: ${{ github.event.inputs.TEST }}
    steps:
      - name: Set report variables
        run: |
          TEST_NAME="${TEST_NODEID##*::}"
          echo "TEST_NAME=$TEST_NAME" >> "$GITHUB_ENV"
          echo "LATEST_DIR=allure/$TEST_NAME" >> "$GITHUB_ENV"
          echo "RUN_DIR=allure/runs/${{ github.run_id }}/$TEST_NAME" >> "$GITHUB_ENV"

      - name: Download allure results
        uses: actions/download-artifact@v4
        with:
          name: allure-results
          path: ./allure-results

      - name: Checkout gh-pages (for history)
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Restore Allure history
        run: |
          mkdir -p allure-results/history
          if [ -d "gh-pages/${LATEST_DIR}/history" ]; then
            cp -r "gh-pages/${LATEST_DIR}/history/." "allure-results/history/" || true
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Allure commandline
        run: |
          curl -fsSL -o allure.tgz https://github.com/allure-framework/allure2/releases/download/2.30.0/allure-2.30.0.tgz
          tar -xzf allure.tgz
          sudo mv allure-2.30.0 /opt/allure
          echo "/opt/allure/bin" >> "$GITHUB_PATH"

      - name: Generate Allure report
        run: allure generate allure-results -o allure-report --clean

      - name: Deploy run report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          keep_files: true
          publish_dir: allure-report
          destination_dir: ${{ env.RUN_DIR }}

      - name: Deploy latest report with history to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          keep_files: true
          publish_dir: allure-report
          destination_dir: ${{ env.LATEST_DIR }}

      - name: Add links to reports in Summary
        run: |
          BASE_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
          LATEST_URL="${BASE_URL}/${LATEST_DIR}/index.html"
          RUN_URL="${BASE_URL}/${RUN_DIR}/index.html"
          echo "### 📊 Allure report (load scenario)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Test: \`${TEST_NAME}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Latest (with history): [open](${LATEST_URL})" >> $GITHUB_STEP_SUMMARY
          echo "- This run: [open](${RUN_URL})" >> $GITHUB_STEP_SUMMARY
