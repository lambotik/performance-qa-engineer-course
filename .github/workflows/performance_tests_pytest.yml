name: Performance Tests (Pytest + Allure)

on:
  workflow_dispatch:
    inputs:
      TEST:
        type: choice
        required: true
        description: 'Pytest test (single load scenario)'
        default: 'performance_tests/tests/test_load_scenarios.py::test_grpc_gateway_existing_user_get_documents'
        options:
          - performance_tests/tests/test_load_scenarios.py::test_grpc_gateway_existing_user_get_documents
          - performance_tests/tests/test_load_scenarios.py::test_grpc_gateway_existing_user_get_operations
          - performance_tests/tests/test_load_scenarios.py::test_grpc_gateway_existing_user_make_purchase_operation
          - performance_tests/tests/test_load_scenarios.py::test_grpc_gateway_new_user_get_accounts
          - performance_tests/tests/test_load_scenarios.py::test_grpc_gateway_new_user_get_documents
          - performance_tests/tests/test_load_scenarios.py::test_grpc_gateway_new_user_issue_physical_card
          - performance_tests/tests/test_load_scenarios.py::test_grpc_gateway_new_user_make_top_up_operation
          - performance_tests/tests/test_load_scenarios.py::test_http_gateway_existing_user_get_documents
          - performance_tests/tests/test_load_scenarios.py::test_http_gateway_existing_user_get_operations
          - performance_tests/tests/test_load_scenarios.py::test_http_gateway_existing_user_issue_virtual_card
          - performance_tests/tests/test_load_scenarios.py::test_http_gateway_existing_user_make_purchase_operation
          - performance_tests/tests/test_load_scenarios.py::test_http_gateway_new_user_get_accounts
          - performance_tests/tests/test_load_scenarios.py::test_http_gateway_new_user_get_documents
          - performance_tests/tests/test_load_scenarios.py::test_http_gateway_new_user_issue_physical_card
          - performance_tests/tests/test_load_scenarios.py::test_http_gateway_new_user_make_top_up_operation

jobs:
  run-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TEST_NODEID: ${{ github.event.inputs.TEST }}
    steps:
      - name: Set test variables
        run: echo "TEST_NAME=${TEST_NODEID##*::}" >> "$GITHUB_ENV"

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build base Docker image
        run: docker build -f Dockerfile.base -t base-service .

      - name: Start test services
        run: docker compose -f docker-compose.ci.yaml up -d --build

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e ./protos/gen
          pip install allure-pytest

      - name: Run selected load scenario test
        run: pytest "${{ github.event.inputs.TEST }}" --alluredir=./allure-results

      - name: Add allure information
        if: always()
        run: |
          mkdir -p allure-results
          echo "GIT_BRANCH=${{ github.head_ref || github.ref_name }}" >> allure-results/environment.properties
          echo "GIT_COMMIT_ID=${{ github.sha }}" >> allure-results/environment.properties
          echo "GIT_COMMIT_MESSAGE=$(git show -s --format=%s HEAD)" >> allure-results/environment.properties
          echo "GIT_COMMIT_AUTHOR_NAME=$(git show -s --format='%ae' HEAD)" >> allure-results/environment.properties
          echo "GIT_COMMIT_TIME=$(git show -s --format=%ci HEAD)" >> allure-results/environment.properties
          echo "TEST_NAME=${{ env.TEST_NAME }}" >> allure-results/environment.properties
        continue-on-error: true

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
          retention-days: 7

      - name: Upload locust reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: locust-reports
          path: performance_tests/scenarios/**/report.html

      - name: Stop test services
        if: always()
        run: docker compose -f docker-compose.ci.yaml down -v

  generate-report:
    if: always()
    needs: [run-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # 1. Скачиваем результаты тестов
      - name: Download Allure results
        uses: actions/download-artifact@v4
        with:
          name: allure-results
          path: allure-results

      # 2. Скачиваем отчеты Locust
      - name: Download locust reports
        uses: actions/download-artifact@v4
        with:
          name: locust-reports
          path: locust-reports
        continue-on-error: true

      # 3. Чекаутим ветку gh-pages для сохранения истории (тренды)
      - name: Get Allure history
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages
        continue-on-error: true

      # 4. Восстанавливаем историю Allure (если она есть в gh-pages)
      - name: Restore Allure history
        run: |
          mkdir -p allure-results/history
          if [ -d "gh-pages/history" ]; then
            cp -r "gh-pages/history/." "allure-results/history/" || true
          fi

      # 5. Устанавливаем Java (необходима для Allure CLI)
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 6. Устанавливаем Allure CLI версии 2.24.0
      - name: Install Allure commandline
        run: |
          curl -fsSL -o allure.tgz https://github.com/allure-framework/allure2/releases/download/2.24.0/allure-2.24.0.tgz
          tar -xzf allure.tgz
          sudo mv allure-2.24.0 /opt/allure
          echo "/opt/allure/bin" >> "$GITHUB_PATH"

      # 7. Генерируем HTML-отчет Allure
      - name: Generate Allure report
        run: allure generate allure-results -o allure-report --clean

      # 8. Публикуем отчет на GitHub Pages
      - name: Deploy Allure report
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.CI_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-report
          keep_files: true

      # 9. Добавляем ссылку в Summary запуска
      - name: Add link to report in Summary
        run: |
          REPORT_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/index.html"
          echo "### 📊 Allure report (load scenario)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Test: \`${{ github.event.inputs.TEST }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Report (with history/trend): [open](${REPORT_URL})" >> $GITHUB_STEP_SUMMARY